<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#64152D" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#3B0A1E" />
      <stop offset="100%" stop-color="#1a040d" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0" />
      <stop offset="35%" stop-color="#D6B779" />
      <stop offset="70%" stop-color="#caa05d" />
      <stop offset="100%" stop-color="#eedfbc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Outer Ornate Gold Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />
  <rect x="52" y="52" width="1096" height="526" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.2" />

  <!-- Corner Filigree -->
  <path d="M 65 95 L 65 65 L 95 65" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 1135 95 L 1135 65 L 1105 65" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 65 535 L 65 565 L 95 565" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 1135 535 L 1135 565 L 1105 565" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Glowing Heart -->
  <g transform="translate(600, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="50" fill="#64152D" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M0 24 C-35 -15 -48 -45 -18 -55 C-3 -60 0 -35 0 -35 C0 -35 3 -60 18 -55 C48 -45 35 -15 0 24 Z" transform="translate(0, 15) scale(0.85)" fill="url(#goldGrad)" />
  </g>

  <!-- Title: HASEENA -->
  <text x="600" y="340" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="82" font-weight="300" letter-spacing="14" fill="url(#goldGrad)">
    HASEENA
  </text>

  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" letter-spacing="4" fill="#F4DCE2" opacity="0.9">
    &ldquo;Six moments. One beautiful soul.&rdquo;
  </text>

  <!-- Divider Line -->
  <line x1="450" y1="440" x2="750" y2="440" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4" />

  <!-- Attribution -->
  <text x="600" y="490" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="16" letter-spacing="6" fill="url(#goldGrad)" font-weight="500">
    A LITTLE WORLD DEVELOPED WITH LOVE BY NAVEEN
  </text>
</svg>

